name: Build ShiKen APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare Release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ShiKen-ExamApp.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiKen-ExamApp
          path: ShiKen-ExamApp.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          name: ShiKen Exam App v1.3.1
          files: ShiKen-ExamApp.apk
